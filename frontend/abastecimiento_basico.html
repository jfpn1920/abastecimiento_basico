<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abastecimiento_basico</title>
    <link rel="stylesheet" href="abastecimiento_basico.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="abastecimiento_basico.js" defer></script>
</head>
<body>
    <!------------------------------------------>
    <!--|estructuracion_abastecimiento_basico|-->
    <!------------------------------------------>
    <main class="app">
        <header class="encabezado">
            <h1>Abastecimiento Básico</h1>
            <p>Un producto necesita reposición cuando su stock está por debajo del mínimo.</p>
        </header>
        <!--------------------------------->
        <!--|formulario_agregar_producto|-->
        <!--------------------------------->
        <section class="panel">
            <h2>Agregar producto</h2>
            <form id="formulario" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre del producto</label>
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ej: Arroz 500 g"
                        maxlength="40"
                        autocomplete="off"
                    >
                </div>
                <div class="fila">
                    <div class="campo">
                        <label for="actual">Stock actual</label>
                        <input
                            type="number"
                            id="actual"
                            placeholder="Ej: 4"
                            min="0"
                            step="1"
                        >
                    </div>
                    <div class="campo">
                        <label for="minimo">Stock mínimo</label>
                        <input
                            type="number"
                            id="minimo"
                            placeholder="Ej: 10"
                            min="1"
                            step="1"
                        >
                    </div>
                </div>
                <p id="mensaje" class="mensaje" role="alert"></p>
                <button type="submit" class="boton">
                    Agregar producto
                </button>
            </form>
        </section>
        <!----------------------------------->
        <!--|resumen_abastecimiento_basico|-->
        <!----------------------------------->
        <section class="resumen">
            <div class="dato">
                <span>Productos</span>
                <strong id="totalProductos">0</strong>
            </div>
            <div class="dato alerta">
                <span>Por reponer</span>
                <strong id="totalReponer">0</strong>
            </div>
        </section>
        <!------------------------------->
        <!--|filtros_y_lista_productos|-->
        <!------------------------------->
        <section class="panel">
            <nav class="filtros">
                <button
                    class="filtro"
                    data-filtro="reponer"
                    type="button"
                >
                    Por reponer
                </button>
                <button
                    class="filtro"
                    data-filtro="todos"
                    type="button"
                >
                    Todos
                </button>
            </nav>
            <p id="vacio" class="vacio" hidden></p>
            <ul id="lista" class="lista"></ul>
        </section>
    </main>
</body>
</html>
